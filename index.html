<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Ballester Finances</title>
<link rel="manifest" href="./manifest.webmanifest">
<meta name="theme-color" content="#121722">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Finances">
<link rel="apple-touch-icon" href="./icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #121722; color: #E8EAEF;
    display: flex; align-items: center; justify-content: center;
    padding: 24px; padding-top: calc(24px + env(safe-area-inset-top));
  }
  .lock { width: 100%; max-width: 400px; text-align: center; }
  .mark {
    width: 72px; height: 72px; border-radius: 18px; margin: 0 auto 22px;
    background: #1B2230; color: #F28C40; border: 1px solid #2A3446;
    font-size: 40px; font-weight: 800;
    display: flex; align-items: center; justify-content: center;
  }
  h1 { font-size: 26px; font-weight: 700; margin-bottom: 8px; letter-spacing: -0.01em; }
  .sub { font-size: 15px; color: #9AA3B5; margin-bottom: 26px; }
  input {
    width: 100%; font-family: inherit; font-size: 19px; text-align: center;
    padding: 14px 16px; border: 1.5px solid #2A3446; border-radius: 12px;
    background: #1B2230; color: #E8EAEF; outline: none;
  }
  input:focus { border-color: #F28C40; }
  button {
    width: 100%; margin-top: 12px; font-family: inherit; font-size: 17px; font-weight: 600;
    padding: 14px 16px; border: none; border-radius: 12px;
    background: #F28C40; color: #14161c; cursor: pointer;
  }
  button:active { opacity: 0.85; }
  button:disabled { opacity: 0.6; }
  .msg { min-height: 24px; margin-top: 14px; font-size: 14px; color: #E06C5A; }
  .msg.quiet { color: #77809314; color: #9AA3B5; }
  .foot { margin-top: 34px; font-size: 12px; color: #5B6478; }
</style>
</head>
<body>
  <main class="lock" id="lock" hidden>
    <div class="mark" aria-hidden="true">B</div>
    <h1>Ballester Finances</h1>
    <p class="sub">Enter your passcode.<br>You'll only need to do this once on this device.</p>
    <form id="form">
      <input id="pass" type="password" autocomplete="current-password" autocapitalize="none"
             autocorrect="off" spellcheck="false" placeholder="passcode" aria-label="Passcode">
      <button id="go" type="submit">Open dashboard</button>
    </form>
    <p class="msg" id="msg" role="status"></p>
    <p class="foot">Private family document · <span id="stamp"></span></p>
  </main>

<script>
(function () {
  "use strict";
  var BUILD = "v3";
  document.getElementById("stamp").textContent = "build " + BUILD;

  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("./sw.js").catch(function () {});
  }

  var enc = new TextEncoder(), dec = new TextDecoder();
  var lockEl = document.getElementById("lock");
  var msgEl = document.getElementById("msg");
  var passEl = document.getElementById("pass");
  var goEl = document.getElementById("go");
  var payloadPromise = fetch("./data.enc.json?v=" + BUILD, { cache: "no-cache" })
    .then(function (r) { if (!r.ok) throw new Error("fetch " + r.status); return r.json(); });

  function b64ToBytes(s) {
    var bin = atob(s), out = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
    return out;
  }
  function bytesToB64(bytes) {
    var bin = "";
    for (var i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
    return btoa(bin);
  }
  function deriveKey(pass, salt, iter) {
    return crypto.subtle.importKey("raw", enc.encode(pass), "PBKDF2", false, ["deriveKey"])
      .then(function (base) {
        return crypto.subtle.deriveKey(
          { name: "PBKDF2", salt: salt, iterations: iter, hash: "SHA-256" },
          base, { name: "AES-GCM", length: 256 }, true, ["decrypt", "encrypt"]);
      });
  }
  function decryptWith(key, payload) {
    return crypto.subtle.decrypt({ name: "AES-GCM", iv: b64ToBytes(payload.iv) }, key, b64ToBytes(payload.ct))
      .then(function (buf) { return JSON.parse(dec.decode(buf)); });
  }
  function boot(plain) {
    return Promise.all([
      fetch("./chart.umd.js").then(function (r) { return r.text(); }),
      fetch("./sankey.js").then(function (r) { return r.text(); })
    ]).then(function (libs) {
      var closer = "</" + "script>";
      var html = plain.content +
        "<script>" + libs[0] + closer +
        "<script>" + libs[1] + closer +
        "<script>" + plain.data + closer +
        "<script>" + plain.prices + closer +
        "<script>" + plain.app + closer;
      document.open();
      document.write(html);
      document.close();
    });
  }
  function showLock(message, quiet) {
    lockEl.hidden = false;
    msgEl.textContent = message || "";
    msgEl.className = quiet ? "msg quiet" : "msg";
    goEl.disabled = false;
    setTimeout(function () { passEl.focus(); }, 50);
  }

  var savedKey = null;
  try { savedKey = localStorage.getItem("bf_key"); } catch (e) {}
  if (savedKey) {
    payloadPromise
      .then(function (payload) {
        return crypto.subtle.importKey("raw", b64ToBytes(savedKey), { name: "AES-GCM" }, true, ["decrypt"])
          .then(function (key) { return decryptWith(key, payload); });
      })
      .then(boot)
      .catch(function () {
        try { localStorage.removeItem("bf_key"); } catch (e) {}
        showLock("");
      });
  } else {
    showLock("");
  }

  document.getElementById("form").addEventListener("submit", function (ev) {
    ev.preventDefault();
    var pass = passEl.value.trim().toLowerCase();
    if (!pass) return;
    goEl.disabled = true;
    msgEl.className = "msg quiet";
    msgEl.textContent = "Opening…";
    payloadPromise
      .then(function (payload) {
        return deriveKey(pass, b64ToBytes(payload.salt), payload.iter).then(function (key) {
          return decryptWith(key, payload).then(function (plain) {
            return crypto.subtle.exportKey("raw", key).then(function (raw) {
              try { localStorage.setItem("bf_key", bytesToB64(new Uint8Array(raw))); } catch (e) {}
              return plain;
            });
          });
        });
      })
      .then(boot)
      .catch(function (err) {
        if (String(err).indexOf("fetch") !== -1) {
          showLock("Couldn't load — check your connection and try again.");
        } else {
          showLock("That's not it — check the passcode and try again.");
        }
      });
  });
})();
</script>
</body>
</html>
